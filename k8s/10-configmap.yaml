apiVersion: v1
kind: ConfigMap
metadata:
  name: cs2-config
  namespace: cs2
data:
  # container-internal paths — PVCs mount here
  DEMO_DIR: /app/demos
  DB_PATH: /app/data/lineups.db
  HLTV_REQUEST_DELAY: "2.5"
  # point at the LAN machine running CS2 to enable practice-mode RCON
  RCON_HOST: "127.0.0.1"
  RCON_PORT: "27015"
