# Hourly incremental HLTV catalog refresh. The endpoint queues a background
# task and returns immediately; 409 means an ingest is already running —
# expected overlap, treated as success so the CronJob doesn't false-alarm.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: catalog-refresh
  namespace: cs2
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: refresh
              image: curlimages/curl:8.11.1
              command:
                - /bin/sh
                - -c
                - >
                  code=$(curl -s -o /dev/null -w '%{http_code}' -X POST
                  http://backend:8000/api/catalog/refresh);
                  echo "refresh HTTP $code";
                  [ "$code" = "200" ] || [ "$code" = "409" ]
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 32Mi }
