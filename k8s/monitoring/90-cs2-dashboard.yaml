# Provisioned via the Grafana sidecar (label grafana_dashboard). Panels use
# the default Prometheus datasource.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cs2-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cs2-meta-engine.json: |
    {
      "uid": "cs2-meta-engine",
      "title": "CS2 Meta Engine",
      "schemaVersion": 39,
      "refresh": "30s",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request rate by handler (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [ { "refId": "A", "expr": "sum by (handler) (rate(http_requests_total{namespace=\"cs2\"}[5m]))", "legendFormat": "{{handler}}" } ]
        },
        {
          "id": 2, "type": "timeseries", "title": "p95 latency by handler (s)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [ { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, handler) (rate(http_request_duration_seconds_bucket{namespace=\"cs2\"}[5m])))", "legendFormat": "{{handler}}" } ]
        },
        {
          "id": 3, "type": "timeseries", "title": "5xx responses (req/s)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [ { "refId": "A", "expr": "sum(rate(http_requests_total{namespace=\"cs2\", status=~\"5..\"}[5m]))", "legendFormat": "5xx" } ]
        },
        {
          "id": 4, "type": "timeseries", "title": "Backend memory working set",
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [ { "refId": "A", "expr": "container_memory_working_set_bytes{namespace=\"cs2\", container=\"backend\"}", "legendFormat": "backend" } ]
        },
        {
          "id": 5, "type": "timeseries", "title": "Backend CPU (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [ { "refId": "A", "expr": "rate(container_cpu_usage_seconds_total{namespace=\"cs2\", container=\"backend\"}[5m])", "legendFormat": "backend" } ]
        },
        {
          "id": 6, "type": "timeseries", "title": "Container restarts (cs2 namespace)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [ { "refId": "A", "expr": "kube_pod_container_status_restarts_total{namespace=\"cs2\"}", "legendFormat": "{{pod}}/{{container}}" } ]
        }
      ]
    }
