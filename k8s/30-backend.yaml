apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cs2
  labels:
    app: backend
spec:
  # Stateless API: ingest runs as jobs in Postgres (backend/jobs.py) and is
  # executed by the separate worker Deployment, so replicas can scale and
  # roll without downtime. local-path RWO volumes mount fine on one node.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: localhost:5000/cs2-backend:latest
          imagePullPolicy: IfNotPresent   # pulled from the local registry; CI pins SHA tags
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: cs2-config
            - secretRef:
                name: cs2-secrets        # includes DATABASE_URL
          env:
            - name: PROCESS_ROLE
              value: api                 # enqueue only; the worker executes
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 3Gi          # demo parses spike; 110 MB demo observed at ~614 Mi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 12   # 60 s boot budget
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: app-data
              mountPath: /app/data
            - name: demos
              mountPath: /app/demos
            - name: player-photos
              mountPath: /app/backend/data/player_photos
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data
        - name: demos
          persistentVolumeClaim:
            claimName: demos
        - name: player-photos
          persistentVolumeClaim:
            claimName: player-photos
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: cs2
  labels:
    app: backend      # ServiceMonitor selects on this
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
