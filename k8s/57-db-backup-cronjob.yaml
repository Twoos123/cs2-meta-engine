# Nightly logical backup of the app database. Postgres holds everything
# that can't be rebuilt by re-parsing demos (clustered lineups, executes,
# player stats, practice lists, catalog, job history, settings), so it gets
# a consistent pg_dump. Demos, timelines and photos are re-downloadable /
# re-derivable and are covered by the VM-level vzdump (README → Backups).
#
# Restore:  gunzip -c cs2-<stamp>.sql.gz | kubectl -n cs2 exec -i postgres-0 -- psql -U cs2 cs2
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  namespace: cs2
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
  namespace: cs2
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16.10-alpine     # same major as the server's pg_dump
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu -o pipefail
                  KEEP=14
                  out="/backups/cs2-$(date +%Y%m%d-%H%M%S).sql.gz"
                  pg_dump --no-owner --no-privileges | gzip > "$out.part"
                  mv "$out.part" "$out"
                  [ -f /app/data/user_settings.json ] && cp /app/data/user_settings.json /backups/ || true
                  ls -1t /backups/cs2-*.sql.gz | tail -n +$((KEEP + 1)) | xargs -r rm --
                  echo "backup ok: $(basename "$out") ($(du -h "$out" | cut -f1))"
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  value: cs2
                - name: PGDATABASE
                  value: cs2
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - name: app-data
                  mountPath: /app/data
                  readOnly: true
                - name: backups
                  mountPath: /backups
          volumes:
            - name: app-data
              persistentVolumeClaim:
                claimName: app-data
            - name: backups
              persistentVolumeClaim:
                claimName: backups
