# Single-origin config: serve the built SPA, proxy /api to the FastAPI
# backend. Deployed into nginx-unprivileged (worker uid 101, port 8080).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # resolve the backend service through Docker's embedded DNS at request
    # time, so a recreated backend container (new IP) never requires an
    # nginx reload
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # demo uploads run up to 2 GB (config max_demo_size_mb)
    client_max_body_size 2g;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200;
    }

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # stream uploads straight through instead of spooling 2 GB to disk
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        # first view of a demo parses it on demand; AI insights call Claude —
        # both legitimately run for minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Vite emits content-hashed filenames under /assets — cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback for React Router routes (/lineups, /replay/..., /anti-strat)
    location / {
        try_files $uri /index.html;
    }
}
