# CI + push-to-deploy.
#
# test / frontend run on GitHub-hosted runners for every push and PR, so
# checks still report when the homelab (and its self-hosted runner) is off.
# build-and-deploy runs only for pushes to main, after both checks pass:
# build both images on the self-hosted runner (the k3s VM), push to the
# loopback registry, roll the Deployments to the new SHA tag. Runner,
# registry, and cluster share one node, so images never cross the LAN.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "screenshots/**"
      - "terraform/**"
      - "ansible/**"
  pull_request:

concurrency:
  group: ${{ github.event_name == 'push' && 'deploy' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock pytest ruff

      - name: Lint (errors + unused imports)
        run: ruff check backend tests --select E9,F63,F7,F82,F401

      - name: Tests
        run: pytest

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Validate Terraform roots (no credentials, no backend)
        run: |
          for root in terraform terraform/cloudflare; do
            echo "::group::$root"
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build

  build-and-deploy:
    needs: [test, frontend]
    if: github.event_name == 'push'
    runs-on: self-hosted
    env:
      KUBECONFIG: /home/debian/.kube/config
      REGISTRY: localhost:5000
    steps:
      - uses: actions/checkout@v5

      - name: Compute image tag
        run: echo "TAG=${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - name: Build images
        run: |
          docker build -f docker/backend.Dockerfile \
            -t "$REGISTRY/cs2-backend:$TAG" -t "$REGISTRY/cs2-backend:latest" .
          docker build -f docker/frontend.Dockerfile \
            -t "$REGISTRY/cs2-web:$TAG" -t "$REGISTRY/cs2-web:latest" .

      - name: Push to local registry
        run: |
          docker push "$REGISTRY/cs2-backend:$TAG"
          docker push "$REGISTRY/cs2-backend:latest"
          docker push "$REGISTRY/cs2-web:$TAG"
          docker push "$REGISTRY/cs2-web:latest"

      - name: Deploy to k3s
        run: |
          kubectl apply -R -f k8s/
          kubectl -n cs2 set image deploy/backend "backend=$REGISTRY/cs2-backend:$TAG"
          kubectl -n cs2 set image deploy/web "nginx=$REGISTRY/cs2-web:$TAG"
          kubectl -n cs2 rollout status deploy/backend --timeout=300s
          kubectl -n cs2 rollout status deploy/web --timeout=120s

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://localhost/api/health
